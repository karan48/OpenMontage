identity:
  name: "Tech Review"
  category: motion-graphics
  mood: crisp, confident, honest, energetic
  pace: fast
  best_for: "Product reviews, long-form (16:9) and Shorts (9:16) — hands-on footage or product shots with spec cards, pros and cons, comparisons and a clear verdict"

visual_language:
  color_palette:
    primary: ["#4CC9F0", "#1B1F27"]
    accent: ["#FF9F1C", "#FFE066"]
    background: "#0F1115"
    text: "#F5F7FA"
    muted: "#9AA3B2"
  composition: product hero on a dark seamless backdrop; full-screen verdict card at the end; 16:9 = product on the left third with spec cards and comparison tables on the right, chapter cards between sections; 9:16 = product in the centre third, spec cards across the top third, text kept out of the bottom 20% and right 15% (Shorts UI)
  texture: clean studio — dark seamless backdrop, soft rim light on the product, subtle reflections, no grain

typography:
  headings:
    font: "Space Grotesk"
    weight: 700
    tracking: "-0.01em"
  body:
    font: "Inter (Devanagari: Noto Sans Devanagari)"
    weight: 400
    line_height: 1.5
  code:
    font: "JetBrains Mono"
    weight: 400
  stat_card:
    font: "Space Grotesk"
    weight: 700
    size_multiplier: 3.5
  scale_system: "major_third"
  weight_matrix:
    title: 800
    heading: 700
    body: 400
    caption: 400

motion:
  transitions: [cut, slide-up, zoom-punch, whip-pan]
  animation_style: "snappy UI motion — spec cards spring in on a stiff spring with no wobble, numbers count up, the product zoom-punches on key claims, pros and cons tick in one at a time"
  pacing_rules:
    min_scene_hold_seconds: 1.0
    max_scene_hold_seconds: 4.0
    text_card_hold_seconds: 2.0
    stat_card_hold_seconds: 2.0
    transition_duration_seconds: 0.2
  entrance: "slide up 24px with fade, stiff spring"
  exit: "hard cut on the beat"

audio:
  voice_style: "energetic but honest — a friend who actually used the product; fast, clear and confident, slowing down for the verdict"
  music_mood: "upbeat electronic or lo-fi beat, driving but light; drops out under the verdict line"
  music_volume: 0.10
  sfx_style: "UI clicks, whooshes on card entrances, a soft ding on the score reveal"
  ducking_threshold_db: -4
  voice_variation_allowed: true
  hero_moment_voice_shift: "slower, lower and deliberate on the verdict"
  transition_voice_shift: "a quick breath, then back up to energy"

asset_generation:
  image_prompt_prefix: "clean product photography, dark seamless studio background, soft rim light, sharp focus, "
  image_negative_prompt: "cluttered, cartoon, invented brand logos, distorted product, text, watermark"
  diagram_style: "minimal spec bars and side-by-side comparison tables with a single highlight colour"
  consistency_anchors:
    - "The product itself is always real — official images or your own footage, never an AI-invented version of it"
    - "Dark seamless (#0F1115) backdrop for product hero shots"
    - "Cyan (#4CC9F0) for pros, orange (#FF9F1C) for cons, always paired with check/cross icons so meaning never relies on colour alone"
    - "Space Grotesk numerals for every spec, price and score"

overlays:
  stat_card:
    bg: "#1B1F27"
    border: "#4CC9F0"
    text: "#F5F7FA"
    radius: 12
    shadow: "0 8px 24px rgba(0,0,0,0.45)"
  key_term:
    bg: "#4CC9F0"
    text: "#0F1115"
    radius: 6
  code_block:
    bg: "#1B1F27"
    text: "#F5F7FA"
    highlight: "#FF9F1C"

quality_rules:
  - "Minimum contrast ratio 4.5:1 for all text"
  - "Verdict-tease hook first (e.g. 'Is this worth ₹X? Short answer…') — within 2 seconds in a Short, 15 seconds in a long review"
  - "Price and who the product is for come early — within 10 seconds in a Short, 45 seconds in a long review"
  - "Every claim is backed by a spec, a test or footage on screen"
  - "Always show both pros and cons — never a pure hype piece"
  - "Product visuals show the real product; never an AI-generated product shot"
  - "Sponsorship or affiliate links are disclosed on screen whenever they apply"
  - "End on a full-screen verdict card with a score"

chart_palette:
  - "#4CC9F0"
  - "#FF9F1C"
  - "#FFE066"
  - "#9AA3B2"

color_rules:
  harmony_type: "split-complementary"
  contrast_validation: true
  colorblind_safe: true
